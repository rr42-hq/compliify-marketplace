# Hard-coded credentials in the source tree.
id: corporate.secrets
category: corporate
scope:
  fact: controls.secrets_in_code
  op: exists
when:
  fact: controls.secrets_in_code
  op: eq
  value: "yes"
then:
  verdict: non_compliant
  severity: medium
action: flag
because:
  rationale: >-
    Credentials or API keys are hard-coded in the source tree. Secrets in
    code leak through version control, CI logs, and AI-assisted tooling;
    they must be moved to a secrets manager or environment configuration and
    the exposed credentials rotated.
  citation: "Corporate security baseline — secrets management"
